# arugula.stream: the relay, the site, meet and the dashboard, in
# production. `fly deploy` from the repo root (the image builds the sites
# into the relay). Postgres: the Managed Postgres cluster arugula-stream-db
# (iad), database and user presence_prod, attached as DATABASE_URL;
# migrations run before each release. Secrets: SECRET_KEY_BASE,
# DEMO_SECRET, DATABASE_URL, RELEASE_COOKIE, and the sign-in, mail and
# calls ones (relay/README.md). Billing stays off (no STRIPE_*) until
# live Stripe. Two machines in iad, beside the database, clustered.
app = "arugula-stream"
primary_region = "iad"

[deploy]
  release_command = "/app/bin/presence_relay eval PresenceRelay.Release.migrate()"

[build]
  dockerfile = "relay/Dockerfile"

[env]
  PHX_HOST = "arugula.stream"
  PORT = "4000"
  METRICS_PORT = "9091"
  DEMO = "1"
  # meet's guests' publishable key works from meet.arugula.stream and from
  # arugula.stream/meet.
  MEET_ORIGINS = "https://meet.arugula.stream,https://arugula.stream"
  # Fly's private network (and the Managed Postgres host on it) is IPv6.
  ECTO_IPV6 = "true"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Past 300 connections a machine is "busy" to Fly's proxy, which then
  # sends new ones to the other machine (and starts it if it's stopped):
  # one performance-1x holds about 400 people sending frames (#330).
  [http_service.concurrency]
    type = "connections"
    soft_limit = 300
    hard_limit = 10000

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

# /metrics (#318's P12) on the internal port 9091, which no service
# exposes: Fly scrapes it into its managed Grafana (fly-metrics.net), with
# the app, instance and region as labels. ops/README.md has the
# dashboard and the alerts.
[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  # A real core each: 10× team scale (800 people sending frames) needs
  # about two thirds of one per machine, and a shared CPU's quota (1/16 of
  # a core, 1/8 for shared-cpu-2x) can't hold it (#330, ops/README.md).
  size = "performance-1x"
  memory = "2gb"
